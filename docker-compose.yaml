x-airflow: &airflow
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/demo-passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: jsonplaceholder-local-demo-shared-jwt-secret
    WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres:5432/jsonplaceholder
  volumes:
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow
    user: '0:0'
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        mkdir -p /opt/airflow/data
        chown 50000:0 /opt/airflow/data
        chmod 775 /opt/airflow/data
        exec runuser -u airflow -- airflow db migrate

  airflow:
    <<: *airflow
    command: standalone
    ports:
      - '127.0.0.1:${AIRFLOW_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health = json.load(urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=3)); assert all(health[key]['status'] == 'healthy' for key in ('metadatabase', 'scheduler', 'triggerer', 'dag_processor'))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  postgres-data:
  airflow-logs:
